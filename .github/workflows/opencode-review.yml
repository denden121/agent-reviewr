name: opencode-review

# Runs the opencode AI agent as an automatic code reviewer on every pull request.
# Docs: https://opencode.ai/docs/github/
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Do not run more than one review per PR at a time; cancel superseded runs.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts to avoid spending tokens on unfinished work.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are reviewing this pull request. Post a GitHub review with INLINE
            comments anchored to specific lines of the diff — not one big comment.

            IMPORTANT: Write everything in Russian (на русском языке). Keep code
            identifiers, file paths, and code snippets in their original form.

            SCOPE — review ONLY the changes in this PR, not the whole codebase:
            - Base the review strictly on the diff (`gh pr diff`) and the files it
              touches. Do NOT scan or comment on unrelated files.
            - You may open a changed file to read context around a modified line, but
              stay within the changed files. This keeps the review fast and cheap.

            Focus on:
            - Correctness bugs and edge cases (empty input, error paths, async races).
            - Security issues (input validation, injection, unsafe data handling).
            - API contract consistency between the Express backend and the React frontend.
            - Test coverage gaps for the changed code.
            - Readability and maintainability, but keep nits brief.

            Ground every point in the actual diff. If the change looks good, say so
            clearly in the summary instead of inventing issues.

            HOW TO POST THE REVIEW (inline comments + verdict + label):
            1. The GitHub CLI `gh` is installed and authenticated via the GITHUB_TOKEN
               environment variable. Determine the repo and PR number from the event:
                 REPO="$GITHUB_REPOSITORY"
                 PR=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            2. Inspect the diff to find valid line numbers to comment on:
                 gh pr diff "$PR" --repo "$REPO"
               Only anchor a comment to a line that appears in this diff. Use the NEW
               file line number and side "RIGHT" for added/context lines; use side
               "LEFT" only for removed lines.
            3. Decide the VERDICT:
               - If you found any blocking bug, security issue, or correctness problem,
                 use "event": "REQUEST_CHANGES".
               - If there are only minor nits or the code is clean, use "event": "COMMENT".
            4. Create ONE review carrying all inline comments. Put file-specific findings
               as inline `comments`; put only the overall summary in the top-level `body`.
               Build a JSON payload and submit it with `gh api`:
                 cat > /tmp/review.json <<'JSON'
                 {
                   "event": "REQUEST_CHANGES",
                   "body": "Краткое резюме ревью на русском.",
                   "comments": [
                     { "path": "frontend/src/App.tsx", "line": 52, "side": "RIGHT",
                       "body": "Замечание к этой строке на русском." }
                   ]
                 }
                 JSON
                 gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input /tmp/review.json
               If a comment's line is rejected by the API (not part of the diff), adjust
               the line to a nearby diff line and retry.
            5. Apply the matching LABEL (the labels "needs-changes" and "lgtm" already
               exist). Set exactly one and remove the other:
               - Verdict REQUEST_CHANGES:
                   gh pr edit "$PR" --repo "$REPO" --add-label needs-changes --remove-label lgtm
               - Verdict COMMENT (clean / nits only):
                   gh pr edit "$PR" --repo "$REPO" --add-label lgtm --remove-label needs-changes
               (`--remove-label` on a label that isn't set is harmless.)
            6. Post exactly one review — do not also add a separate issue comment.
