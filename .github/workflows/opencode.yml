name: opencode

# Interactive mode: mention "/opencode" (or "/oc") in a PR or issue comment and
# the agent runs with your comment as its instruction — ask questions, request
# changes, etc. Workflows on comment events always run from the default branch.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One agent run per thread at a time.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only spend a runner when a trigger phrase is actually present.
    if: >-
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          # No `prompt:` here on purpose — in mention mode the comment text is the
          # instruction. Trigger phrases default to "/opencode,/oc".
